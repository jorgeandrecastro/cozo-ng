[package]
name = "cozo-ng-cli"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "The Cozo-NG command-line tool: query, import/export, vector search and graph algorithms on embedded or remote Cozo-NG databases"
homepage = "https://github.com/jorgeandrecastro/cozo-ng"
repository = "https://github.com/jorgeandrecastro/cozo-ng"
readme = "README.md"
keywords = ["cli", "database", "graph", "datalog", "vector-search"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "cozo-ng"
path = "src/main.rs"

[features]
default = ["sqlite", "graph-algo"]
## SQLite storage backend (bundled, easy to compile).
sqlite = ["cozo/minimal"]
## Graph algorithms (PageRank, Dijkstra, ...), needed by `cozo-ng graph`.
graph-algo = ["cozo/graph-algo"]
## RocksDB storage backend (slow to compile, needs a C++ toolchain).
rocksdb = ["cozo/storage-rocksdb"]
## Everything.
full = ["sqlite", "graph-algo", "rocksdb"]

[dependencies]
cozo = { package = "cozo-ng", version = "0.11.1", path = "../cozo-core", default-features = false }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
rustyline = "19.0"
comfy-table = "7"
miette = { version = "7.6", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
csv = "1"
minreq = { version = "3.0", features = ["https-rustls"] }
toml = "0.8"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
