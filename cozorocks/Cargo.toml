[package]
name = "cozo-ng-rocks"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MPL-2.0"
authors = ["Ziyang Hu","Jorge andre Castro"]
description = "RocksDB storage adapter for Cozo-NG"
homepage = "https://github.com/jorgeandrecastro/cozo-ng"
repository = "https://github.com/jorgeandrecastro/cozo-ng"
documentation = "https://docs.rs/cozo-ng-rocks"
readme = "README.md"
keywords = ["rocksdb", "storage", "database", "cozo", "ffi"]
categories = ["database", "database-implementations"]
exclude = ["rocksdb/docs", "rocksdb/java"]

[package.metadata.docs.rs]
no-default-features = true
no-deps = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
cxx = "1.0.205"
miette = "7.6"
libc = "0.2"
tikv-jemalloc-sys = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"], optional = true }
lz4-sys = { version = "1.11" }
zstd-sys = { version = "2.1", features = ["zdict_builder"] }

[features]
jemalloc = ["tikv-jemalloc-sys"]
io-uring = ["pkg-config"]

[build-dependencies]
cxx-build = "1.0.205"
pkg-config = { version = "0.3.34", optional = true }
cc = { version = "1.11", features = ["parallel"] }

[lib]
name = "cozorocks"