name: PyPI Release

on:
  push:
    # branches:
    #   - main
    #   - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: messense/maturin-action@v1
        with:
          working-directory: cozo-lib-python
          rust-toolchain: stable
          manylinux: manylinux_2_28
          command: build
          args: --release --sdist -o dist --find-interpreter -F compact -F storage-rocksdb
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: cozo-lib-python/dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: messense/maturin-action@v1
        with:
          working-directory: cozo-lib-python
          rust-toolchain: stable
          command: build
          args: --release -o dist --find-interpreter -F compact -F storage-rocksdb
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: cozo-lib-python/dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: messense/maturin-action@v1
        with:
          working-directory: cozo-lib-python
          rust-toolchain: stable
          command: build
          args: --release -o dist --find-interpreter -F compact -F storage-rocksdb
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: cozo-lib-python/dist/*

  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    if: startsWith(github.ref, 'refs/tags/')
    # On garde uniquement linux dans les besoins puisque windows et macos sont commentés ci-dessus
    needs: [linux]
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish to PyPI
        uses: messense/maturin-action@v1
        with:
          command: upload
          args: --skip-existing artifacts/wheels-*/*/* artifacts/wheels-*/*.tar.gz artifacts/wheels-*/*.whl