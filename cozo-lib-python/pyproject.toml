[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "cozo-ng"
version = "0.12.2"
description = "The Embedded Graph + Vector Database for AI Agents & GraphRAG in Python"
requires-python = ">=3.7"
classifiers = [
    "Topic :: Database",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
module-name = "cozo_embedded"
features = ["compact", "storage-rocksdb"]