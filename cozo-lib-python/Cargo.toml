[package]
name = "cozo-ng-python"
version = "0.14.0"
edition = "2024"
rust-version = "1.85"
description = "The Embedded Graph + Vector Database for AI Agents & GraphRAG in Python"
authors = ["Jorge André Castro", "Ziyang Hu"]
license = "MPL-2.0"
homepage = "https://github.com/jorgeandrecastro/cozo-ng"
repository = "https://github.com/jorgeandrecastro/cozo-ng"
documentation = "https://github.com/jorgeandrecastro/cozo-ng"
readme = "README.md"

[lib]
name = "cozo_embedded"
crate-type = ["cdylib"]

[features]
compact = ["minimal", "requests", "graph-algo"]
mobile = ["storage-sqlite", "graph-algo"]
minimal = ["storage-sqlite"]
storage-sqlite = ["cozo/storage-sqlite"]
storage-rocksdb = ["cozo/storage-rocksdb"]
graph-algo = ["cozo/graph-algo"]
requests = ["cozo/requests"]
jemalloc = ["cozo/jemalloc"]
io-uring = ["cozo/io-uring"]

[dependencies]
cozo = { package = "cozo-ng", version = "0.13", path = "../cozo-core", default-features = false }
pyo3 = { version = "0.22.6", features = ["extension-module", "abi3", "abi3-py39", "gil-refs"] }
miette = "7.6"
serde_json = "1.0"